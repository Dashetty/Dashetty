<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232">
  <defs>
    <pattern id="wipGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#142e1f" stroke-width="0.3"/>
    </pattern>
  </defs>

  <rect width="1000" height="200" rx="8" fill="#0a1f14" stroke="#1a3d2a" stroke-width="2"/>
  <rect width="1000" height="200" rx="8" fill="url(#wipGrid)"/>

  <!-- Caption -->
  <text x="500" y="32" font-family="'SF Mono', monospace" font-size="12" font-style="italic" fill="#aed581"
        text-anchor="middle" opacity="0.85">Dashed lines mean the cut isn't finished yet. But it will be.</text>
  <line x1="350" y1="44" x2="650" y2="44" stroke="#7cb342" stroke-width="1" opacity="0.3"/>

  <!-- Cut lines (dashed, showing work in progress) -->
  <g stroke="#7cb342" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6">
    <line x1="80" y1="80" x2="300" y2="80"/>
    <line x1="80" y1="72" x2="80" y2="152"/>
    <line x1="300" y1="72" x2="300" y2="152"/>
    <line x1="80" y1="152" x2="300" y2="152"/>
  </g>

  <!-- WIP Item 1: AI Deep Dive -->
  <g transform="translate(100, 87)">
    <text x="0" y="0" font-family="monospace" font-size="13" fill="#e8f5e9" font-weight="bold">Submerging into AI</text>
    <text x="0" y="18" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">Understanding capabilities &amp; limits,</text>
    <text x="0" y="32" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">building with it, not for it.</text>
    <!-- Progress indicator -->
    <rect x="0" y="42" width="165" height="6" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="0" y="42" width="129" height="6" rx="3" fill="#7cb342" opacity="0.7"/>
    <text x="173" y="49" font-family="monospace" font-size="9" fill="#7cb342">78%</text>
  </g>

  <!-- Cut lines 2 -->
  <g stroke="#7cb342" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6">
    <line x1="380" y1="80" x2="620" y2="80"/>
    <line x1="380" y1="72" x2="380" y2="152"/>
    <line x1="620" y1="72" x2="620" y2="152"/>
    <line x1="380" y1="152" x2="620" y2="152"/>
  </g>

  <!-- WIP Item 2: System Design -->
  <g transform="translate(400, 87)">
    <text x="0" y="0" font-family="monospace" font-size="13" fill="#e8f5e9" font-weight="bold">System Design Study</text>
    <text x="0" y="18" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">Distributed systems &amp; scalability,</text>
    <text x="0" y="32" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">architecture of things that last.</text>
    <!-- Progress indicator -->
    <rect x="0" y="42" width="165" height="6" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="0" y="42" width="58" height="6" rx="3" fill="#7cb342" opacity="0.5"/>
    <text x="173" y="49" font-family="monospace" font-size="9" fill="#7cb342">35%</text>
  </g>

  <!-- Cut lines 3 -->
  <g stroke="#7cb342" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6">
    <line x1="700" y1="80" x2="920" y2="80"/>
    <line x1="700" y1="72" x2="700" y2="152"/>
    <line x1="920" y1="72" x2="920" y2="152"/>
    <line x1="700" y1="152" x2="920" y2="152"/>
  </g>

  <!-- WIP Item 3: Building in Public -->
  <g transform="translate(720, 87)">
    <text x="0" y="0" font-family="monospace" font-size="13" fill="#e8f5e9" font-weight="bold">Building in Public</text>
    <text x="0" y="18" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">Shipping work before it's perfect.</text>
    <text x="0" y="32" font-family="monospace" font-size="10" fill="#aed581" opacity="0.8">Repos, process, mind — all open.</text>
    <!-- Progress indicator -->
    <rect x="0" y="42" width="165" height="6" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="0" y="42" width="145" height="6" rx="3" fill="#7cb342" opacity="0.75"/>
    <text x="173" y="49" font-family="monospace" font-size="9" fill="#7cb342">88%</text>
  </g>

  <!-- Throughline -->
  <text x="500" y="200" font-family="monospace" font-size="10" fill="#e8f5e9"
        text-anchor="middle" opacity="0.85">I build things that are both technically sound and human-centered. AI is a tool, system design is</text>
  <text x="500" y="216" font-family="monospace" font-size="10" fill="#e8f5e9"
        text-anchor="middle" opacity="0.85">the foundation, and the interface is where they meet — which is why the pixels still matter.</text>
</svg>