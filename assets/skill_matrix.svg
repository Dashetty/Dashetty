<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268">
  <defs>
    <pattern id="skillGrid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#142e1f" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="268" rx="8" fill="#0a1f14" stroke="#1a3d2a" stroke-width="2"/>
  <rect width="1200" height="268" rx="8" fill="url(#skillGrid)"/>

  <!-- Caption -->
  <text x="600" y="35" font-family="'SF Mono', monospace" font-size="13" font-style="italic" fill="#aed581"
        text-anchor="middle" opacity="0.85">Every tool has its edge. Here's where mine currently cut:</text>
  <line x1="430" y1="45" x2="770" y2="45" stroke="#7cb342" stroke-width="1" opacity="0.3"/>

  <!-- ═══ LEFT COLUMN ═══ -->

  <!-- Python -->
  <g transform="translate(100, 64)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">Python</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Primary Weapon</text>
    <rect x="160" y="4" width="250" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="160" y="4" width="237" height="14" rx="3" fill="#7cb342" opacity="0.85"/>
    <text x="420" y="15" font-family="monospace" font-size="11" fill="#aed581">95%</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(100, 97)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">TypeScript</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Web Stack Core</text>
    <rect x="160" y="4" width="250" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="160" y="4" width="225" height="14" rx="3" fill="#7cb342" opacity="0.8"/>
    <text x="420" y="15" font-family="monospace" font-size="11" fill="#aed581">90%</text>
  </g>

  <!-- React / Next.js -->
  <g transform="translate(100, 130)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">React / Next.js</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Frontend Architecture</text>
    <rect x="160" y="4" width="250" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="160" y="4" width="212" height="14" rx="3" fill="#7cb342" opacity="0.75"/>
    <text x="420" y="15" font-family="monospace" font-size="11" fill="#aed581">85%</text>
  </g>

  <!-- CSS / Tailwind -->
  <g transform="translate(100, 163)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">CSS / Tailwind</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Pixel-Perfect Precision</text>
    <rect x="160" y="4" width="250" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="160" y="4" width="237" height="14" rx="3" fill="#7cb342" opacity="0.85"/>
    <text x="420" y="15" font-family="monospace" font-size="11" fill="#aed581">95%</text>
  </g>

  <!-- ═══ RIGHT COLUMN ═══ -->

  <!-- SQL / Databases -->
  <g transform="translate(580, 64)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">SQL / PostgreSQL</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Data Layer</text>
    <rect x="180" y="4" width="200" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="180" y="4" width="160" height="14" rx="3" fill="#7cb342" opacity="0.65"/>
    <text x="390" y="15" font-family="monospace" font-size="11" fill="#aed581">80%</text>
  </g>

  <!-- Git / GitHub Actions -->
  <g transform="translate(580, 97)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">Git / CI·CD</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Building in Public</text>
    <rect x="180" y="4" width="200" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="180" y="4" width="170" height="14" rx="3" fill="#7cb342" opacity="0.7"/>
    <text x="390" y="15" font-family="monospace" font-size="11" fill="#aed581">85%</text>
  </g>

  <!-- Docker -->
  <g transform="translate(580, 130)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">Docker</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Containerization</text>
    <rect x="180" y="4" width="200" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="180" y="4" width="120" height="14" rx="3" fill="#7cb342" opacity="0.5"/>
    <text x="390" y="15" font-family="monospace" font-size="11" fill="#aed581">60%</text>
  </g>

  <!-- System Design -->
  <g transform="translate(580, 163)">
    <text x="0" y="14" font-family="monospace" font-size="12" fill="#e8f5e9" font-weight="bold">System Design</text>
    <text x="0" y="28" font-family="monospace" font-size="9" fill="#7cb342" opacity="0.6">Currently Honing</text>
    <rect x="180" y="4" width="200" height="14" rx="3" fill="#0f2e1c" stroke="#1a3d2a" stroke-width="1"/>
    <rect x="180" y="4" width="100" height="14" rx="3" fill="#7cb342" opacity="0.4"/>
    <text x="390" y="15" font-family="monospace" font-size="11" fill="#aed581">50%</text>
  </g>

  <!-- Bottom note -->
  <text x="600" y="206" font-family="monospace" font-size="10" fill="#7cb342" 
        text-anchor="middle" opacity="0.4">
    [ SHARPNESS INDICATES CURRENT PROFICIENCY · ALL BLADES ARE REGULARLY HONED ]
  </text>

  <!-- Decorative blade icons at bottom -->
  <g transform="translate(544, 218)" opacity="0.2">
    <rect x="0" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="12" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="24" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="36" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="48" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="60" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="72" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="84" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="96" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
    <rect x="108" y="0" width="4" height="16" rx="2" fill="#7cb342"/>
  </g>
  <text x="600" y="252" font-family="monospace" font-size="9" fill="#7cb342" 
        text-anchor="middle" opacity="0.3">10 BLADES · 10 LEVELS · 0 EXCUSES</text>
</svg>