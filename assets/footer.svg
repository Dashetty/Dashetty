  <!-- Small ruler marks -->
  <g stroke="#7cb342" stroke-width="1" opacity="0.2">
    <line x1="100" y1="100" x2="100" y2="92"/>
    <line x1="200" y1="100" x2="200" y2="92"/>
    <line x1="300" y1="100" x2="300" y2="92"/>
    <line x1="400" y1="100" x2="400" y2="92"/>
    <line x1="500" y1="100" x2="500" y2="92"/>
    <line x1="600" y1="100" x2="600" y2="92"/>
    <line x1="700" y1="100" x2="700" y2="92"/>
    <line x1="800" y1="100" x2="800" y2="92"/>
    <line x1="900" y1="100" x2="900" y2="92"/>
    <line x1="1000" y1="100" x2="1000" y2="92"/>
    <line x1="1100" y1="100" x2="1100" y2="92"/>
  </g>
