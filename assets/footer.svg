<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100">
  <rect width="1200" height="100" fill="#0a1f14"/>

  <!-- Bottom edge measurement ticks -->
  <g stroke="#7cb342" stroke-width="1.2" opacity="0.5">
    <line x1="50" y1="100" x2="50" y2="82" stroke-width="2"/>
    <line x1="150" y1="100" x2="150" y2="82" stroke-width="2"/>
    <line x1="250" y1="100" x2="250" y2="82" stroke-width="2"/>
    <line x1="350" y1="100" x2="350" y2="82" stroke-width="2"/>
    <line x1="450" y1="100" x2="450" y2="82" stroke-width="2"/>
    <line x1="550" y1="100" x2="550" y2="82" stroke-width="2"/>
    <line x1="650" y1="100" x2="650" y2="82" stroke-width="2"/>
    <line x1="750" y1="100" x2="750" y2="82" stroke-width="2"/>
    <line x1="850" y1="100" x2="850" y2="82" stroke-width="2"/>
    <line x1="950" y1="100" x2="950" y2="82" stroke-width="2"/>
    <line x1="1050" y1="100" x2="1050" y2="82" stroke-width="2"/>
    <line x1="1150" y1="100" x2="1150" y2="82" stroke-width="2"/>
