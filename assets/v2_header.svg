<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <!-- Base dark green -->
    <linearGradient id="matGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2818"/>
      <stop offset="100%" style="stop-color:#051a10"/>
    </linearGradient>

    <!-- Fine grid pattern — 1cm equivalent -->
    <pattern id="fineGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3d2a" stroke-width="0.6"/>
    </pattern>

    <!-- Major grid — 5cm equivalent -->
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" stroke="#2d5a3d" stroke-width="1.2"/>
    </pattern>

    <!-- Glow for text -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" style="stop-color:#000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.4"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="400" fill="url(#matGradient)"/>
  <rect width="1200" height="400" fill="url(#fineGrid)"/>
  <rect width="1200" height="400" fill="url(#majorGrid)"/>
  <rect width="1200" height="400" fill="url(#vignette)"/>

  <!-- Top edge measurement ticks -->
  <g stroke="#7cb342" stroke-width="1.2" opacity="0.7">
    <!-- Major ticks every 50px (5 units) -->
    <line x1="50" y1="0" x2="50" y2="18" stroke-width="2"/>
    <line x1="150" y1="0" x2="150" y2="18" stroke-width="2"/>
    <line x1="250" y1="0" x2="250" y2="18" stroke-width="2"/>
    <line x1="350" y1="0" x2="350" y2="18" stroke-width="2"/>
    <line x1="450" y1="0" x2="450" y2="18" stroke-width="2"/>
    <line x1="550" y1="0" x2="550" y2="18" stroke-width="2"/>
    <line x1="650" y1="0" x2="650" y2="18" stroke-width="2"/>
    <line x1="750" y1="0" x2="750" y2="18" stroke-width="2"/>
    <line x1="850" y1="0" x2="850" y2="18" stroke-width="2"/>
    <line x1="950" y1="0" x2="950" y2="18" stroke-width="2"/>
    <line x1="1050" y1="0" x2="1050" y2="18" stroke-width="2"/>
    <line x1="1150" y1="0" x2="1150" y2="18" stroke-width="2"/>
    <!-- Minor ticks -->
    <line x1="100" y1="0" x2="100" y2="10"/>
    <line x1="200" y1="0" x2="200" y2="10"/>
    <line x1="300" y1="0" x2="300" y2="10"/>
    <line x1="400" y1="0" x2="400" y2="10"/>
    <line x1="500" y1="0" x2="500" y2="10"/>
    <line x1="600" y1="0" x2="600" y2="10"/>
    <line x1="700" y1="0" x2="700" y2="10"/>
    <line x1="800" y1="0" x2="800" y2="10"/>
    <line x1="900" y1="0" x2="900" y2="10"/>
    <line x1="1000" y1="0" x2="1000" y2="10"/>
    <line x1="1100" y1="0" x2="1100" y2="10"/>
  </g>

  <!-- Top numbers -->
  <g fill="#7cb342" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" opacity="0.55" text-anchor="middle">
    <text x="50" y="32">0</text>
    <text x="150" y="32">5</text>
    <text x="250" y="32">10</text>
    <text x="350" y="32">15</text>
    <text x="450" y="32">20</text>
    <text x="550" y="32">25</text>
    <text x="650" y="32">30</text>
    <text x="750" y="32">35</text>
    <text x="850" y="32">40</text>
    <text x="950" y="32">45</text>
    <text x="1050" y="32">50</text>
    <text x="1150" y="32">55</text>
  </g>

  <!-- Left edge ticks -->
  <g stroke="#7cb342" stroke-width="1.2" opacity="0.7">
    <line x1="0" y1="50" x2="18" y2="50" stroke-width="2"/>
    <line x1="0" y1="100" x2="18" y2="100" stroke-width="2"/>
    <line x1="0" y1="150" x2="18" y2="150" stroke-width="2"/>
    <line x1="0" y1="200" x2="18" y2="200" stroke-width="2"/>
    <line x1="0" y1="250" x2="18" y2="250" stroke-width="2"/>
    <line x1="0" y1="300" x2="18" y2="300" stroke-width="2"/>
    <line x1="0" y1="350" x2="18" y2="350" stroke-width="2"/>
    <line x1="0" y1="75" x2="10" y2="75"/>
    <line x1="0" y1="125" x2="10" y2="125"/>
    <line x1="0" y1="175" x2="10" y2="175"/>
    <line x1="0" y1="225" x2="10" y2="225"/>
    <line x1="0" y1="275" x2="10" y2="275"/>
    <line x1="0" y1="325" x2="10" y2="325"/>
    <line x1="0" y1="375" x2="10" y2="375"/>
  </g>

  <!-- Left numbers -->
  <g fill="#7cb342" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" opacity="0.55" text-anchor="end">
    <text x="38" y="54">0</text>
    <text x="38" y="104">5</text>
    <text x="38" y="154">10</text>
    <text x="38" y="204">15</text>
    <text x="38" y="254">20</text>
    <text x="38" y="304">25</text>
    <text x="38" y="354">30</text>
  </g>

  <!-- Angle guides (the curved ones from real cutting mats) -->
  <g stroke="#7cb342" stroke-width="1" opacity="0.2" fill="none">
    <!-- 15° -->
    <path d="M 50 350 Q 400 250 600 142"/>
    <!-- 30° -->
    <path d="M 50 350 Q 300 200 350 127"/>
    <!-- 45° -->
    <path d="M 50 350 L 250 100"/>
    <!-- 60° -->
    <path d="M 50 350 Q 150 150 175 80"/>
  </g>

  <!-- Angle labels -->
  <g fill="#7cb342" font-family="monospace" font-size="10" opacity="0.3">
    <text x="610" y="145">15°</text>
    <text x="360" y="130">30°</text>
    <text x="260" y="95">45°</text>
    <text x="185" y="75">60°</text>
  </g>

  <!-- Corner radius guide -->
  <path d="M 1100 50 Q 1150 50 1150 100" stroke="#7cb342" stroke-width="1" fill="none" opacity="0.15"/>

  <!-- ═══════ MAIN CONTENT AREA ═══════ -->
  <!-- The "cut" rectangle where everything lives -->
  <rect x="80" y="70" width="1040" height="280" rx="6" 
        fill="#0f2e1c" stroke="#7cb342" stroke-width="2" opacity="0.95"/>

  <!-- Inner subtle grid in content area -->
  <defs>
    <pattern id="contentGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#1a3d2a" stroke-width="0.4"/>
    </pattern>
  </defs>
  <rect x="80" y="70" width="1040" height="280" rx="6" fill="url(#contentGrid)"/>

  <!-- Registration marks (corners) -->
  <g stroke="#7cb342" stroke-width="2" opacity="0.8">
    <line x1="70" y1="60" x2="95" y2="60"/><line x1="70" y1="60" x2="70" y2="85"/>
    <line x1="1105" y1="60" x2="1130" y2="60"/><line x1="1130" y1="60" x2="1130" y2="85"/>
    <line x1="70" y1="335" x2="70" y2="360"/><line x1="70" y1="360" x2="95" y2="360"/>
    <line x1="1105" y1="360" x2="1130" y2="360"/><line x1="1130" y1="335" x2="1130" y2="360"/>
  </g>

  <!-- Name -->
  <text x="600" y="175" 
        font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" 
        font-size="54" 
        font-weight="700" 
        fill="#e8f5e9" 
        text-anchor="middle"
        letter-spacing="8"
        filter="url(#textGlow)">
    H A R D E E P
  </text>
  <text x="600" y="220" 
        font-family="'SF Mono', 'Fira Code', 'Courier New', monospace" 
        font-size="28" 
        font-weight="400" 
        fill="#aed581" 
        text-anchor="middle"
        letter-spacing="12"
        opacity="0.9">
    D A S H E T T Y
  </text>

  <!-- Divider -->
  <line x1="350" y1="245" x2="850" y2="245" stroke="#7cb342" stroke-width="1" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="275" 
        font-family="'SF Mono', monospace" 
        font-size="13" 
        fill="#7cb342" 
        text-anchor="middle"
        letter-spacing="4"
        opacity="0.8">
    MEASURE TWICE  ·  CUT ONCE  ·  SHIP ALWAYS
  </text>

  <!-- Small decorative: a "blade" icon -->
  <g transform="translate(1058, 308)" opacity="0.3">
    <path d="M 0 0 L 15 0 L 15 25 L 7.5 35 L 0 25 Z" fill="#7cb342"/>
    <line x1="7.5" y1="0" x2="7.5" y2="30" stroke="#0a1f14" stroke-width="1"/>
  </g>
</svg>